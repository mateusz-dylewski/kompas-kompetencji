<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nie znaleziono strony – Kompas Kompetencji</title>
<link rel="icon" type="image/png" href="/app/assets/icon-kk.png">
<link rel="stylesheet" href="/app/app.css">
<style>
  .nf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;text-align:center;background:#fff}
  .nf img{width:120px;height:120px;margin-bottom:24px}
  .nf .code{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--navy);text-transform:uppercase;margin:0 0 8px}
  .nf h1{font-size:28px;margin:0 0 12px;color:var(--tx)}
  .nf p{max-width:520px;color:var(--mu);margin:0 0 24px;line-height:1.5}
  .nf .acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .nf a.btn{display:inline-flex;align-items:center;height:44px;padding:0 20px;text-decoration:none;border:1.5px solid var(--navy);color:var(--navy);background:#fff;font-weight:700}
  .nf a.btn.primary{background:var(--navy);color:#fff}
  .nf a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<main class="nf">
  <img src="/app/assets/icon-kk.png" alt="" width="120" height="120">
  <p class="code">Błąd 404</p>
  <h1>Nie znaleziono strony</h1>
  <p>Ten adres nie istnieje albo został przeniesiony. Wróć do strony głównej i przejdź do potrzebnej sekcji.</p>
  <div class="acts">
    <a class="btn primary" href="/">Wróć do strony głównej</a>
  </div>
</main>
</body>
</html>
